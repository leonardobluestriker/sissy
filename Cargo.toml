[package]
name = "sissy"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
